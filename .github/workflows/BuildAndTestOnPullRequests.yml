name: CI for Pull Requests

on:
  push:
    branches: [ dev, master ]
  pull_request:
    branches: [ dev, master ]

jobs:
  Build_Stateless_solution:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: dotnet restore
      
    - name: Build Stateless solution
      run: dotnet build Stateless.sln --configuration Release --no-restore
      
    - name: Test with coverage (xUnit, Cobertura)
      run: dotnet test --configuration Release --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=Cobertura
      
    - name: Re-sign assemblies with full strong name
      run: |
        # Re-sign all built assemblies with the private key
        $assemblies = Get-ChildItem -Path "src\Stateless\bin\Release" -Filter "*.dll" -Recurse
        foreach ($assembly in $assemblies) {
          sn -R $assembly.FullName ../../asset/Stateless.snk
        }
      
    - name: Install ReportGenerator
      run: dotnet tool install -g dotnet-reportgenerator-globaltool
      
    - name: Generate coverage report
      run: |
        reportgenerator -reports:"**/coverage.cobertura.xml" -targetdir:"coveragereport" -reporttypes:"MarkdownSummaryGithub;Html;Badges"
      
    - name: Append coverage to job summary
      if: always()
      run: |
        $SUMMARY_FILE = "${{ github.workspace }}/coveragereport/SummaryGithub.md"
        if (Test-Path $SUMMARY_FILE) {
          Get-Content $SUMMARY_FILE | Add-Content $env:GITHUB_STEP_SUMMARY
        } else {
          "Coverage summary not found at $SUMMARY_FILE" | Add-Content $env:GITHUB_STEP_SUMMARY
        }
      
    - name: Upload coverage artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coveragereport
        if-no-files-found: warn
        retention-days: 7

    - name: Pack alpha version
      if: github.ref == 'refs/heads/dev' && github.event_name == 'push' && github.repository == 'dotnet-state-machine/stateless'
      run: dotnet pack src\Stateless\Stateless.csproj --version-suffix dev-${{github.run_id}} --configuration Release
    - name: Publish alpha version
      if: github.ref == 'refs/heads/dev' && github.event_name == 'push' && github.repository == 'dotnet-state-machine/stateless'
      run: dotnet nuget push src\Stateless\bin\Release\*.nupkg -s nuget.org --api-key ${{ secrets.NUGETAPIKEY }}
  
    - name: Pack Release version
      if: github.ref == 'refs/heads/master' && github.event_name == 'push' && github.repository == 'dotnet-state-machine/stateless'
      run: dotnet pack src\Stateless\Stateless.csproj --configuration Release
    - name: Publish Release version
      if: github.ref == 'refs/heads/master' && github.event_name == 'push' && github.repository == 'dotnet-state-machine/stateless'
      run: dotnet nuget push src\Stateless\bin\Release\*.nupkg -s nuget.org --api-key ${{ secrets.NUGETAPIKEY }}
